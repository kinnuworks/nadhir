  supports: [R3, R5, R10, G1]
  quotes:
    - text: "Other XML signature mechanisms MUST NOT be used in CAP Alert Messages."
      locator: "§3.3.4.1 Digital Signatures"
    - text: "“Cancel” - Cancels the earlier message(s) identified in <references>"
      locator: "§3.2.1 alert, <msgType> code values"
