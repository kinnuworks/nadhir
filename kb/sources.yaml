# ---------------------------------------------------------------- Ontario, Pickering, 12 January 2020

- id: ON-PICKERING-2020
  title: "Investigation into the emergency alerts sent on January 12, 2020"
  publisher: "Government of Ontario, Ministry of the Solicitor General (Office of the Provincial Security Advisor)"
  date: "2020-02-27"
  url: "https://web.archive.org/web/20230220145556id_/https://www.ontario.ca/page/investigation-emergency-alerts-sent-january-12-2020"
  kind: investigation-report
  jurisdiction: "Canada, Ontario"
  status: verified-primary
  fetched_at: "2026-11-09"
  sha256: "08e03898b23a652a9e5f6d18d896ae2f2d7b8acfe01176234740a94a6a3feb78"
  supports: [R1, R2, R10]
  quotes:
    - text: "On January 12, 2020, the DO logged in to the Alert Ready live system, believed they had switched to the training system, selected a pre-scripted nuclear template for the PNGS and accidentally sent a live alert."
      locator: "Executive summary"
    - text: "Identical pre-scripted templates were used on both the Alert Ready live and training systems. No distinctive labelling such as “EXERCISE, EXERCISE, EXERCISE…” was used on the training system."
      locator: "Executive summary, Key findings: A review of Pre-scripted Messages in the Alert Ready System"
    - text: "A single user can draft and issue an alert by re-entering their password as a final step on the live system. There is no system requirement to forward the alert to a supervisor, designate or peer for review."
      locator: "Investigation and findings, The Alert Ready system: Alert approval"
  notes: >-
    The live ontario.ca URL now lands on an Archives of Ontario page about archived sites, so the Wayback Machine
    raw capture of 20 Feb 2023 was used (page shows 'Updated: October 20, 2021'). The release date of 27 Feb 2020
    is from press coverage (e.g. Global News), not from the page. Alert texts come from two screenshots on
    files.ontario.ca embedded in the report: solgen-nuclear-alert-screenshot-01-10-2021.png (sha256
    049326659a7fe66abf718e242e3f137cafef2f9c80373f1993b5c26aec942e92) and
    solgen-second-nuclear-alertjan2020-sm-14-10-2021.png (sha256
    69a21057a6a8fa6e09cd27ddf455c2286640aee9d8a6bd2f70bd2bece5d30e18). The report also finds both alerts were
    English only (no French templates).

