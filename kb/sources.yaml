  title: "國防部發布新聞稿，針對「中共今(9)日下午發射長征系列運載火箭，相關告警訊息發布狀況」乙情說明(113年1月9日)"
  publisher: "Ministry of National Defense, Republic of China (Taiwan)"
  date: "2024-01-09"
  url: "https://www.mnd.gov.tw/news/pressrelease/82446"
  kind: official-statement
  jurisdiction: Taiwan
  status: verified-primary
  fetched_at: "2026-11-09"
  sha256: "8cc4171bb77fbefd33b8eeb29fa9cdcc70b9981d786d817016a811965d680e5a"
  supports: [R11]
  quotes:
    - text: "五、對於此次發布作業期間，英文用字錯誤、表達不夠精準，國防部向大眾致歉，將深入檢討、周延作業程序。"
      locator: "point 5 (release time 2050)"
    - text: "國軍即運用國家告警系統，以空中威脅警告、簡訊方式告知國人提高警覺。"
      locator: "point 1"
  notes: >-
    Title in English (our translation): MND press release on the alert messages issued for China's Long March
    launch on the afternoon of 9 January 2024. Unofficial translation of quote 1: "5. For the wrong English wording
    and imprecise expression during this issuance, the MND apologises to the public and will review and tighten
    its procedures." Fetched via the Publish.aspx?p=82446 URL, which redirected here. The earlier 16:15 statement
    was not found on the MND site; it is quoted in TW-2024-TWN.

- id: TW-2024-TWN
  title: "國防部２度道歉！中國衛星非預警飛越台灣南部上空 英文警報糗用「missile」"
  publisher: "Taiwan News (台灣英文新聞)"
  date: "2024-01-09"
  url: "https://www.taiwannews.com.tw/ch/news/5074742"
  kind: press
  jurisdiction: Taiwan
  status: verified-secondary
  fetched_at: "2026-11-09"
  sha256: "b38b12d27493fbdbdaa5919ef1516d224e6d3eb6ffce2cb69dae573091cb3da4"
  supports: [R11]
  quotes:
    - text: "惟簡訊英文用語，因疏忽未同步更新原系統用字、精準表達發射物係衛星而非飛彈，國防部向社會大眾致歉。"
      locator: "article body, MND statement of 16:15 as quoted"
    - text: "然而，警報的英文內容「Missile flyover Taiwan airspace, be aware」卻使用飛彈「Missile」一詞"
      locator: "article body"
  notes: >-
    Secondary: press report quoting the MND 16:15 statement in full. Published 2024-01-09 15:36, updated
    2024-01-10 09:44. Its rendering of the Chinese alert text is a paraphrase, not a verbatim copy. Unofficial
    translation of quote 1: "However, through oversight the English wording of the message was not updated in step
    with the original system wording to state precisely that the launched object was a satellite, not a missile;
    the MND apologises to the public."

- id: TW-2024-CNA
  title: "Taiwan's military apologizes over 'missile flyover' message mishap"
  publisher: "Central News Agency (CNA), via GlobalSecurity.org"
  date: "2024-01-09"
  url: "https://www.globalsecurity.org/wmd/library/news/taiwan/2024/taiwan-240109-cna03.htm"
  kind: press
  jurisdiction: Taiwan
  status: verified-secondary
  fetched_at: "2026-11-09"
  sha256: "84dd0056626f807c2d534b9422d40ed077534e21a1f35d42215cab48aeaaebed"
  supports: [R11]
  quotes:
    - text: "The MND explained that the mistake was made due to a failure to update the English wording used in the emergency text message"
      locator: "article body"
    - text: "The English part of the template that read \"[Air raid Alert] Missile flyover Taiwan airspace, be aware\" was not changed."
      locator: "article body"
    - text: "A search of the PWS system found no templates for satellite launches so the message was likely based on a template from the \"Missile air raid alert\" category."
      locator: "article body"
  notes: "Secondary: CNA English story mirrored by GlobalSecurity.org; the original at https://focustaiwan.tw/politics/202401090018 is paywalled after the first paragraph. The template detail is CNA's own finding, not an MND statement."
