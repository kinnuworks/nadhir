# Knowledge base registry for the pre-broadcast alert gate.
# Metadata, hashes and short verbatim quotes only. Full documents are not stored here.
# Field meanings and the checking method are in kb/README.md.
# Rule ids R1-R11 are the gate rules. Gap ids:
#   G1 CAP / X.1303bis has no defined field for AI involvement or a named approver
#   G2 no public UAE operational rule on who approves an AI-drafted public alert (Charter principles only)
#   G3 AI or machine translation of alerts: no UAE rule; US split (FCC refuses MT for WEA, NWS uses AI translation)
#   G4 no public UAE CAP feed on the WMO register
#   G5 no international norm on after-action reporting for false public alerts

schema_version: 1
fetched_at_default: "2026-11-08"

sources:

