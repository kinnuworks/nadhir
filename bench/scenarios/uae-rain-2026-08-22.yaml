reference_ar: أبوظبي في 22 أغسطس / وام / أصدر المركز الوطني للأرصاد تنبيها بشأن فرصة تكون سحب ركامية يصاحبها سقوط أمطار تتراوح
  بين الخفيفة والمتوسطة، وتكون غزيرة أحيانا. وحدد المركز الفترة الزمنية لهذا التنبيه بدءا من الساعة 01:30 من ظهر اليوم السبت،
  لتستمر حتى الساعة 09:00 من مساء اليوم ذاته، مشيرا إلى أن هذه الحالة الجوية ستشمل بعض المناطق الشرقية والجنوبية والغربية،
