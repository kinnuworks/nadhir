reference_ar: أبوظبي في 17 فبراير / وام / حذّر المركز الوطني للأرصاد من فرصة تشكل الضباب وتدنّي مدى الرؤية الأفقية، قد تصل
  أحياناً إلى انعدامها على بعض المناطق الغربية من الدولة، وذلك ابتداءً من الساعة 21:30 مساء اليوم، وحتى الساعة 10:00 من صباح
