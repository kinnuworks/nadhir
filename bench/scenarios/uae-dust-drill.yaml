label: Our scenario. A drill built on a real NCM warning (via WAM). Tests that a drill stays a drill.
inputs:
- text: ABU DHABI, 16th February, 2026 (WAM) -- The National Centre of Meteorology (NCM) warned today of active to occasionally
    strong northwesterly winds, raising dust and sand and reducing horizontal visibility to less than 3,000 metres in some
    coastal and inland areas. The Centre stated in a statement issued today that the weather conditions began at 10:30 and
    will continue until 18:00, urging the public to exercise caution, particularly when driving on external and open roads,
    due to the risk of sudden drops in visibility caused by blowing dust.
  verified: true
  source: NCM via WAM, 2026-02-16, https://www.wam.ae/en/article/byrq247-national-centre-meteorology-warns-dust-reduced
