- text: ABU DHABI, 4th March, 2026 (WAM) -- The National Centre of Meteorology (NCM) has warned of active northwesterly winds
    affecting various areas across the UAE, expected to be fresh to strong at times, causing blowing dust and sand and reducing
    horizontal visibility to less than 2,000 metres in some coastal and inland areas. The centre stated that the expected
