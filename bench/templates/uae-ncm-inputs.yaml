items:
  - id: NCM-2026-03-04-dust
    date: "2026-03-04"
    hazard: dust
    source_type: state_news_agency
    text_en: "ABU DHABI, 4th March, 2026 (WAM) -- The National Centre of Meteorology (NCM) has warned of active northwesterly winds affecting various areas across the UAE, expected to be fresh to strong at times, causing blowing dust and sand and reducing horizontal visibility to less than 2,000 metres in some coastal and inland areas. The centre stated that the expected weather conditions began at 14:55 and continue until 19:00 this evening. It urged members of the public to exercise caution, especially while driving on open roads, due to the possibility of reduced horizontal visibility caused by blowing dust."
    text_ar: "أبوظبي في 4 مارس /وام/ حذر المركز الوطني للأرصاد من نشاط الرياح الشمالية الغربية على مناطق متفرقة من الدولة متوقعا أن تكون نشطة السرعة وقوية أحياناً، وتؤدي إلى إثارة الغبار والأتربة وتدني مدى الرؤية الأفقية إلى أقل من 2000 متر على بعض المناطق الساحلية والداخلية. وأوضح المركز أن الحالة الجوية المتوقعة تبدأ من الساعة 14:55 وتستمر حتى الساعة 19:00 مساءً، داعياً أفراد المجتمع إلى توخي الحيطة والحذر، خاصة أثناء القيادة على الطرق المكشوفة، نظراً لاحتمالية تدني الرؤية الأفقية بسبب الأتربة المثارة."
    headline_en: "NCM warns of dusty northwesterly winds, reduced visibility"
    headline_ar: "\"الوطني للأرصاد\" يحذر من رياح شمالية غربية نشطة مثيرة للغبار وتدني الرؤية حتى 2000 متر"
    published_en: "2026-03-04 16:43 (WAM page time)"
    published_ar: "2026-03-04 16:38 (WAM page time)"
