# Real public UAE National Center of Meteorology (NCM) warnings, as published in English and Arabic by the
# Emirates News Agency (WAM, the UAE state news agency), which relays NCM statements.
# Inputs for the drafting agent in the UAE dust-storm replay scenario. Text is copied as published,
# including WAM's own dateline. Nothing here is an alert broadcast to phones; these are NCM weather
# warnings and advisories as reported by WAM. The English and Arabic items are separate WAM stories, not
# line-by-line translations of each other, and can differ in detail.
# Fetched 2026-11-09 by rendering the WAM pages in a headless browser (the pages load their text with JavaScript).
source_type_legend:
