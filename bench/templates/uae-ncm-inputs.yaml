  - id: NCM-2026-02-16-dust
    date: "2026-02-16"
    hazard: dust
    source_type: state_news_agency
    text_en: "ABU DHABI, 16th February, 2026 (WAM) -- The National Centre of Meteorology (NCM) warned today of active to occasionally strong northwesterly winds, raising dust and sand and reducing horizontal visibility to less than 3,000 metres in some coastal and inland areas. The Centre stated in a statement issued today that the weather conditions began at 10:30 and will continue until 18:00, urging the public to exercise caution, particularly when driving on external and open roads, due to the risk of sudden drops in visibility caused by blowing dust."
    text_ar: "أبوظبي في 16 فبراير /وام/ حذّر المركز الوطني للأرصاد، من نشاط رياح شمالية غربية تكون نشطة السرعة وقوية أحياناً، ومثيرة للغبار والأتربة، ما يؤدي إلى تدنٍ في مدى الرؤية الأفقية إلى أقل من 3000 متر على بعض المناطق الساحلية والداخلية. وأوضح المركز، في بيانٍ له اليوم، أن الحالة الجوية تبدأ من الساعة 10:30 صباحاً وتستمر حتى الساعة 18:00 مساءً، داعياً أفراد المجتمع إلى توخي الحيطة والحذر، خاصةً أثناء القيادة على الطرق الخارجية والمكشوفة، نظراً لاحتمال تدني الرؤية المفاجئ بسبب الأتربة المثارة."
    headline_en: "National Centre of Meteorology warns of dust, reduced visibility"
    headline_ar: "\"الوطني للأرصاد\" يحذر من رياح قوية مثيرة للغبار وتدنٍ في الرؤية الأفقية"
    published_en: "2026-02-16 11:21 (WAM page time)"
    published_ar: "2026-02-16 10:44 (WAM page time)"
