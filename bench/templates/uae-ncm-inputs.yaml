  - id: NCM-2026-02-17-fog
    date: "2026-02-17"
    hazard: fog
    source_type: state_news_agency
    text_en: "ABU DHABI, February 17, 2026 (WAM) – The National Center for Meteorology (NCM) has issued a weather warning regarding potential fog formation and significantly reduced horizontal visibility across several western regions of the UAE. According to the NCM statement released on Tuesday, visibility is expected to deteriorate—and may drop to zero at times—starting from 21:30 tonight until 10:00 AM Wednesday, February 18. The Center has urged motorists to exercise extreme caution on the roads. Drivers are advised to follow all traffic safety guidelines, maintain a safe distance from other vehicles, and strictly adhere to modified speed limits, particularly in areas experiencing thick fog."
    text_ar: "أبوظبي في 17 فبراير / وام / حذّر المركز الوطني للأرصاد من فرصة تشكل الضباب وتدنّي مدى الرؤية الأفقية، قد تصل أحياناً إلى انعدامها على بعض المناطق الغربية من الدولة، وذلك ابتداءً من الساعة 21:30 مساء اليوم، وحتى الساعة 10:00 من صباح يوم غد الأربعاء. وأهاب المركز، في بيان له، بالسائقين توخي الحيطة والحذر أثناء القيادة، واتباع إرشادات السلامة المرورية، والالتزام بالسرعات المحددة، خاصة في المناطق التي تشهد انخفاضاً ملحوظاً في مدى الرؤية الأفقية."
    headline_en: "Fog Alert: UAE motorists warned of low visibility through Wednesday morning"
    headline_ar: "المركز الوطني للأرصاد يحذر من الضباب وتدني الرؤية الأفقية حتى صباح الأربعاء"
    published_en: "2026-02-17 21:17 (WAM page time)"
    published_ar: "2026-02-17 21:13 (WAM page time)"
    url: "https://www.wam.ae/en/article/bysbij4-fog-alert-uae-motorists-warned-low-visibility"
    url_ar: "https://www.wam.ae/ar/article/3bnv4zrl-%D8%A7%D9%84%D9%85%D8%B1%D9%83%D8%B2-%D8%A7%D9%84%D9%88%D8%B7%D9%86%D9%8A-%D9%84%D9%84%D8%A3%D8%B1%D8%B5%D8%A7%D8%AF-%D9%8A%D8%AD%D8%B0%D8%B1-%D8%A7%D9%84%D8%B6%D8%A8%D8%A7%D8%A8-%D9%88%D8%AA%D8%AF%D9%86%D9%8A-%D8%A7%D9%84%D8%B1%D8%A4%D9%8A%D8%A9"
    note: "The English says 'modified speed limits'; the Arabic says 'السرعات المحددة' (the set speed limits)."

  - id: NCM-2026-08-22-rain
    date: "2026-08-22"
    hazard: heavy_rain
    source_type: state_news_agency
    text_en: "ABU DHABI, 22nd August, 2026 (WAM) -- The National Centre of Meteorology (NCM) issued an alert over the possibility of convective cloud formation accompanied by light to moderate rainfall, which may become heavy at times. The alert is in effect from 13:30 on Saturday until 21:00 the same day. The NCM said the weather conditions are expected to affect some eastern, southern and western areas, extending to parts of the country's interior."
    text_ar: "أبوظبي في 22 أغسطس / وام / أصدر المركز الوطني للأرصاد تنبيها بشأن فرصة تكون سحب ركامية يصاحبها سقوط أمطار تتراوح بين الخفيفة والمتوسطة، وتكون غزيرة أحيانا. وحدد المركز الفترة الزمنية لهذا التنبيه بدءا من الساعة 01:30 من ظهر اليوم السبت، لتستمر حتى الساعة 09:00 من مساء اليوم ذاته، مشيرا إلى أن هذه الحالة الجوية ستشمل بعض المناطق الشرقية والجنوبية والغربية، وتمتد لتؤثر على بعض المناطق الداخلية."
    headline_en: "NCM forecasts light to heavy rain across several UAE areas from Saturday afternoon"
    headline_ar: "\"الوطني للأرصاد\" : أمطار خفيفة إلى غزيرة على عدة مناطق بدءا من ظهر اليوم"
    published_en: "2026-08-22 12:46 (WAM page time)"
    published_ar: "2026-08-22 12:39 (WAM page time)"
    url: "https://www.wam.ae/en/article/c1v24bo-ncm-forecasts-light-heavy-rain-across-several-uae"
    url_ar: "https://www.wam.ae/ar/article/c1v1wln-%D8%A7%D9%84%D9%88%D8%B7%D9%86%D9%8A-%D9%84%D9%84%D8%A3%D8%B1%D8%B5%D8%A7%D8%AF-%D8%A3%D9%85%D8%B7%D8%A7%D8%B1-%D8%AE%D9%81%D9%8A%D9%81%D8%A9-%D8%A5%D9%84%D9%89-%D8%BA%D8%B2%D9%8A%D8%B1%D8%A9-%D8%B9%D9%84%D9%89-%D8%B9%D8%AF%D8%A9-%D9%85%D9%86%D8%A7%D8%B7%D9%82"
    note: "Same times written two ways: English 13:30 and 21:00 (24-hour clock); Arabic 01:30 من ظهر and 09:00 من مساء (12-hour clock with period words). Useful for testing time grounding (R11)."

  - id: NCM-2024-11-26-dust-rain
    date: "2024-11-26"
    hazard: dust_and_rain
    source_type: state_news_agency
    text_en: "ABU DHABI, 26th November, 2024 (WAM) -- The National Center of Meteorology (NCM) issued a weather advisory, warning of potential dust storms and rainfall from Wednesday through Friday. A surface low-pressure system from the east, combined with an upper-air low-pressure system and jet stream from the west, will lead to cloud formation over parts of the country according to a statement by the NCM today. Weather from Wednesday night until Friday will see clouds amount increase gradually from late night Wednesday over Western areas and move toward coats and islands and over some Northern and Eastern areas with a chance of rainfall on Thursday, and clouds amount decrease gradually on Friday noon time with a drop in temperatures. Sea will be rough to very rough on Thursday and Friday in the Arabian Gulf and moderate to rough in Oman sea. Winds will be southeasterly to northeasterly, shifting to northwesterly, moderate to active in speed and occasionally strong, especially over the sea. They will stir up dust and sand on land, occasionally causing reduced horizontal visibility."
    text_ar: "أبوظبي في 25 نوفمبر/ وام/ توقع المركز الوطني للأرصاد أن تتأثر الدولة بامتداد منخفض جوي سطحي من الشرق، يتزامن مع امتداد منخفض جوي في طبقات الجو العليا، مما يؤدي إلى تدفق كتلة هوائية باردة نسبياً مع تيار هوائي علوي من الغرب. وأوضح المركز، في تقرير له عن الحالة الجوية خلال الفترة من الأربعاء إلى الجمعة، أن هذه التغيرات الجوية ستساهم في تطور السحب على مناطق متفرقة من الدولة. الطقس من ليل الأربعاء إلى الجمعة: تزداد كميات السحب تدريجياً من آخر ليل الأربعاء على المناطق الغربية وتتحرك يوم الخميس باتجاه السواحل والجزر وعلى بعض المناطق الشمالية والشرقية مع فرصة سقوط أمطار وتقل كميات السحب تدريجياً ظهر يوم الجمعة مع انخفاض ملحوظ في درجات الحرارة. الرياح: جنوبية شرقية إلى شمالية شرقية تتحول إلى شِمالية غربية معتدلة إلى نشطة السرعة وقوية أحياناً خاصة على البحر، وتكون مثيرة للغبار والأتربة على اليابسة تؤدي إلى تدني مدى الرؤية الأفقية أحياناً. البحر: مضطرب إلى شديد الاضطراب يومي الخميس والجمعة في الخليج العربي ومتوسط إلى مضطرب الموج في بحر عمان."
    headline_en: "Potential dust storms, rainfall from Wednesday to Friday: NCM"
    headline_ar: "\"الأرصاد\": تأثر الدولة بامتداد منخفض جوي سطحي من الأربعاء إلى الجمعة"
    published_en: "2024-11-26 00:59 (WAM page time)"
    published_ar: "2024-11-25 23:34 (WAM page time)"
    url: "https://www.wam.ae/en/article/148ltir-potential-dust-storms-rainfall-from-wednesday"
    url_ar: "https://www.wam.ae/ar/article/33rqm0gz-%D8%A7%D9%84%D8%A3%D8%B1%D8%B5%D8%A7%D8%AF-%D8%AA%D8%A3%D8%AB%D8%B1-%D8%A7%D9%84%D8%AF%D9%88%D9%84%D8%A9-%D8%A8%D8%A7%D9%85%D8%AA%D8%AF%D8%A7%D8%AF-%D9%85%D9%86%D8%AE%D9%81%D8%B6-%D8%AC%D9%88%D9%8A-%D8%B3%D8%B7%D8%AD%D9%8A"
    note: "Advisory, not a short warning. English has the typo 'coats' (for coasts) as published. Arabic dateline is 25 November, English 26 November."

