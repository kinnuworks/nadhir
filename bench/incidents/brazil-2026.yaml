real_outcome:
  text: >-
    Phones in several states received 'Extreme Alert' messages overnight, which sound even in silent mode.
    Agência Brasil's preliminary analysis (via Jovem Pan) lists cities totalling about 30 million people; the
    government did not publish a device count. The platform stayed offline while security was restored.
  source: BRAZIL-2026-AB

official_finding:
  body: "Ministério da Integração e do Desenvolvimento Regional (MIDR), Secretaria Nacional de Proteção e Defesa Civil"
  document: "Nota oficial: MIDR aciona Polícia Federal para investigar invasão ao Defesa Civil Alerta (20/06/2026 05h08)"
  finding_status: official-verbatim
  quote: "após ter sofrido uma invasão e disparado um alerta para diversas regiões do país, ordenado remotamente por alguém alheio ao Sistema Nacional de Proteção e Defesa Civil"
  quote_translation_unofficial: "after suffering an intrusion and sending an alert to several regions of the country, ordered remotely by someone outside the National Civil Protection and Defence System"
  source: BRAZIL-2026
  verification_note: "Text read from a print of the gov.br page hosted by Poder360 (PDF, 2 pages); a direct fetch of the gov.br page returned no article text."

expected_rules: [R5]
expected_rules_basis: "R5: originator authentication; an alert not signed by a registered originator key is held."

unknowns:
  - "How access was obtained (central platform credentials, an interface, or another route). The ministry says the platform was invaded; Anatel says the alerts did not pass through the official channels of the ABR Telecom technical platform."
  - "Whether a valid originator credential or key was used. If it was, signature checking alone would not have blocked the messages."
  - "Exact text and target area of each of the ten messages."
  - "Federal Police findings; none published as of the fetch date."

framing_note: >-
  The official note describes an intrusion by someone outside the system and calls it probably a hacker attack.
  The replay tests whether an unsigned or unregistered originator is held. It does not claim the gate would have
  stopped an attacker holding valid credentials; the attack route is not public.

