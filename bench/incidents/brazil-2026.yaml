id: brazil-2026
title: "Unauthorised 'Extreme Alert' messages sent through Brazil's Defesa Civil Alerta platform"
date: "2026-06-19"
jurisdiction: "Brazil (Ministério da Integração e do Desenvolvimento Regional, MIDR; Secretaria Nacional de Proteção e Defesa Civil, SEDEC)"
sources: [BRAZIL-2026, BRAZIL-2026-AB, BRAZIL-2026-OD, BRAZIL-2026-TNW]

summary: >-
  Overnight on 19 to 20 June 2026, someone outside the national civil defence system remotely triggered
  'Extreme Alert' messages through the Defesa Civil Alerta platform to several regions of Brazil, with text
  containing the word 'misantropia'. The ministry took the platform offline at 01:30 and asked the Federal
  Police to investigate.

timeline:
  - {t: "2026-06-19T23:41-03:00", event: "First unauthorised message sent (ministry figure, as reported by Agência Brasil via Jovem Pan); the first alert went to Curitiba.", source: BRAZIL-2026-AB}
  - {t: "2026-06-20T01:23-03:00", event: "Last unauthorised message sent (ministry figure, as reported).", source: BRAZIL-2026-AB}
  - {t: "2026-06-20T01:30-03:00", event: "The Defesa Civil Alerta sending platform is taken offline.", source: BRAZIL-2026}
  - {t: "2026-06-20T05:08-03:00", event: "MIDR publishes an official note: the platform was invaded, the alert was ordered remotely by someone outside the national civil defence system, and the Federal Police will be called in.", source: BRAZIL-2026}
  - {t: "2026-06-20", event: "National Secretary Wolnei Wolff tells a press conference that ten notifications were sent: nine by cell broadcast and one by SMS.", source: BRAZIL-2026-AB}
  - {t: "2026-06-20", event: "Anatel says the alerts, as far as known, did not pass through the official channels of the system's technical platform operated by ABR Telecom.", source: BRAZIL-2026-AB}

