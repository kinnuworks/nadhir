corrections:
  - t: "2023-05-31T07:03+09:00"
    sender: "Ministry of the Interior and Safety"
    text_verbatim: "서울특별시에서 발령한 경계경보는 오발령 사항임을 알려드림"
    text_source: SEOUL-2023-PRESSIAN
    note: "Sent by a different authority from the original sender; whether it referenced the original message is unknown."

real_outcome:
  text: >-
    Phones across Seoul received the city's alert at 06:41 telling people to prepare to evacuate, without a reason
    or a place to go. The ministry's 07:03 text called it erroneous. Korea Times reports confusion and that Naver's
    mobile page was briefly disrupted.
  source: SEOUL-2023-KT

official_finding:
  body: "Ministry of the Interior and Safety (MOIS)"
  document: "MOIS public emergency text of 31 May 2023, 07:03 KST (as quoted by Pressian and YTN)"
  finding_status: official-statement-via-press
  quote: "서울특별시에서 발령한 경계경보는 오발령 사항임을 알려드림"
  quote_translation_unofficial: "We inform you that the air-raid alert issued by the Seoul Metropolitan Government was issued in error."
  source: SEOUL-2023-PRESSIAN
  scope_note: >-
    This is the ministry's own public message, known here through press quotes. No published investigation report
    was found. Seoul disputes the finding (see framing_note). The ministry's position that only Baengnyeong and
    Daecheong were under the alert is reported by Seoul Shinmun and Korea Times.

expected_rules: [R4]
expected_rules_basis: "R4: issuer scope and conflict with an active alert of a higher authority must escalate before release."

unknowns:
  - "Exact original wording of the 06:41 text (press versions differ slightly) and its CAP/CBS parameters."
  - "Who sent the 07:25 lifting message (city or ministry); sources differ."
  - "Whether Seoul's alert required more than one approver."
  - "Whether any later government review reached a formal conclusion."

framing_note: >-
  The city disputed that its alert was an error. Mayor Oh Se-hoon said it may have been an over-reaction by
  working-level officials but was not issued in error, and Seoul said it acted on the ministry's command broadcast.
  The ministry said it had not asked Seoul to send a message. The bench treats the ministry's 07:03 text as the
  authority's statement, and reports the city's view next to it. The gate rule tested is escalation when two
  authorities disagree, not which side was right.

