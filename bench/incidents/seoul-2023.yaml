  text_verbatim_note: "As quoted by YTN. Outlets differ slightly in punctuation and sentence ending (바란다 / 바랍니다), so this is the press-quoted text, not a screenshot of the original."
  text_translation_press: "A warning has been issued for Seoul. People are advised to prepare for evacuation and to give priority to children, the weak and the elderly"
