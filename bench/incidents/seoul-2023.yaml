id: seoul-2023
title: "Seoul city air-raid alert text after a North Korean launch, corrected by the Interior Ministry"
date: "2023-05-31"
jurisdiction: "Republic of Korea (Seoul Metropolitan Government; Ministry of the Interior and Safety, MOIS)"
sources: [SEOUL-2023-SSHINMUN, SEOUL-2023-YTN, SEOUL-2023-PRESSIAN, SEOUL-2023-KT, SEOUL-2023-JA]

summary: >-
  After North Korea's launch of what it called a space launch vehicle, the Interior Ministry issued a civil
  defence alert for two islands near the inter-Korean sea border. Seoul issued its own alert and sent a text to
  the whole city telling people to prepare to evacuate. About 20 minutes later the ministry sent a public text
  saying Seoul's alert was erroneous; the mayor said it may have been an over-reaction but was not an error.

timeline:
  - {t: "2023-05-31T06:29+09:00", event: "North Korea launches a projectile southward (combined account of both agencies, as reported).", source: SEOUL-2023-SSHINMUN}
  - {t: "2023-05-31T06:30+09:00", event: "MOIS central control centre sends a command broadcast to 17 provinces and cities: real alert issued for Baengnyeong-myeon and Daecheong-myeon; areas that did not receive the alert to issue a real alert themselves.", source: SEOUL-2023-SSHINMUN}
  - {t: "2023-05-31T06:32+09:00", event: "Seoul issues an air-raid alert (경계경보) for Seoul on its own judgement. Seoul says it could not reach MOIS by phone to confirm.", source: SEOUL-2023-SSHINMUN}
  - {t: "2023-05-31T06:41+09:00", event: "Seoul sends an emergency text to phones across Seoul telling people to prepare to evacuate.", source: SEOUL-2023-YTN}
  - {t: "2023-05-31T06:43+09:00", event: "Naver's mobile page is briefly disrupted by traffic (06:43 to about 06:48).", source: SEOUL-2023-KT}
  - {t: "2023-05-31T07:03+09:00", event: "MOIS sends an emergency text saying the alert issued by Seoul was erroneous.", source: SEOUL-2023-YTN}
  - {t: "2023-05-31T07:25+09:00", event: "A further text says the alert is lifted across Seoul. Korea Times attributes it to the city government; JoongAng Daily attributes a 07:25 message to the Interior Ministry.", source: SEOUL-2023-KT}
  - {t: "2023-05-31", event: "Mayor Oh Se-hoon apologises for the confusion and says the alert was not issued in error.", source: SEOUL-2023-JA}

